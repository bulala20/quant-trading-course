[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-trading-course"
version = "0.1.0"
description = "A Chinese-first stock quant research and backtesting starter project"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
  "pandas>=1.5,<3",
  "numpy>=1.21,<3",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Investment",
]

[project.scripts]
quant-trading = "quant_trading.cli:main"

[project.gui-scripts]
quant-trading-app = "quant_trading.app:run_app"

[tool.setuptools.packages.find]
include = ["quant_trading*"]
